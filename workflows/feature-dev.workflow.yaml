# Переносимый воркфлоу (aip-style): воркеры в workers/, шаги идут по порядку,
# on_reject на ревью возвращает работу назад, тесты — один блок из трёх проверок.
id: main
title: 'development'
steps:
  - id: plan
    title: 'План (openspec)'
    worker: planner
    sub:
      - { id: research, title: 'Ресерч (по запросу)', worker: researcher, optional: true }
  - { id: plan-review, title: 'Ревью плана', worker: reviewer, on_reject: { goto: plan, max_rounds: 2 } }
  - id: dev
    title: 'Разработка'
    worker: coder
    gate:
      question: 'План аппрувнут? Запускать разработку?'
      options: [approve, request-changes]
  - { id: code-review, title: 'Ревью кода', worker: reviewer, on_reject: { goto: dev, max_rounds: 2 } }
  - id: tests
    title: 'Тесты'
    sub:
      - { id: test-api, title: 'API/бэкенд', worker: tester }
      - { id: test-static, title: 'Статический анализ', worker: tester }
      - { id: test-ui, title: 'Фронт/UI', worker: uitester }
    gate:
      question: 'Код аппрувнут? Запускать тесты?'
      options: [approve, request-changes]
    on_reject: { goto: dev, max_rounds: 2 }
  - id: commit
    title: 'Коммит'
    worker: committer
    deps: [tests]
    gate:
      question: 'Тесты зелёные? Коммитить (без push)?'
      options: [approve, request-changes]
