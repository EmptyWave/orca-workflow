# workflow-view: layout plan:40,182; plan-review:40,472; development:40,630; code-review:40,920; tests:40,1298; commit:40,1544
id: main
title: 'development'
steps:
  - id: plan
    title: 'План (openspec)'
    worker: planner
    sub:
      - { id: docs-research, title: 'Изучение документации и требований', worker: docs-researcher, phase: before_start }
      - { id: code-research, title: 'Ресерч по коду', worker: code-researcher, phase: before_start }
      - { id: web-search, title: 'Поиск необходимой информации', worker: web-searcher, phase: before_start, optional: true }
      - { id: ba-review, title: 'Ревью бизнес дизайна', worker: ba-reviewer, phase: before_start, optional: true }
  - id: plan-review
    title: 'Ревью плана'
    worker: plan-reviewer
    deps: [plan]
    gate:
      question: 'Подтверждаем план?'
      options: [approve, request-changes]
    on_reject: { goto: plan, max_rounds: 3 }
    sub:
      - { id: architecture-review, title: 'Ревью архитектуры', worker: architecture-reviewer, phase: parallel }
  - id: development
    title: 'Разработка'
    worker: developer
    deps: [plan-review]
    sub:
      - { id: stat-analyze, title: 'Статический анализ', worker: stat-analyzer, phase: before_end }
      - { id: plan-diff-review, title: 'Соответствие плану', worker: plan-diff-reviewer, phase: before_end }
  - id: code-review
    title: 'Ревью кода'
    deps: [development]
    on_reject: { goto: development, max_rounds: 3 }
    sub:
      - { id: backend-review, title: 'Ревью бекенда', worker: backend-reviewer, phase: parallel }
      - { id: frontend-review, title: 'Ревью фронта', worker: frontend-reviewer, phase: parallel, optional: true }
      - { id: security-review, title: 'Ревью безопасности', worker: security-reviewer, phase: parallel, optional: true }
  - id: tests
    title: 'Тесты'
    deps: [code-review]
    on_reject: { goto: development, max_rounds: 3 }
    sub:
      - { id: test-api, title: 'API/бэкенд', worker: api-tester, phase: parallel }
      - { id: test-ui, title: 'Фронт/UI', worker: ui-tester, phase: parallel, optional: true }
      - { id: design-review, title: 'Фронт/UI', worker: design-reviewer, phase: parallel, optional: true }
  - id: commit
    title: 'Коммит'
    worker: committer
    deps: [tests]
    sub:
      - { id: qa-doc-write, title: 'Подготовка документации для QA', worker: qa-doc-writer, phase: before_end }
