# on_reject на ревью возвращает работу назад, тесты — один блок из трёх проверок.
id: main
title: 'development'
steps:
  - id: plan
    title: 'План (openspec)'
    worker: planner
    sub:
      - { id: code-research, title: 'Ресерч по коду', worker: code-researcher}
      - { id: web-search, title: 'Поиск необходимой информации', worker: web-searcher, optional: true }
      - { id: ba-review, title: 'Ревью бизнес дизайна', worker: ba-reviewer, optional: true }
  - id: plan-review,
    title: 'Ревью плана',
    worker: plan-reviewer,
    sub:
      - { id: architecture-review, title: 'Ревью архитектуры', worker: architecture-reviewer}
    on_reject: { goto: plan, max_rounds: 2 }
  - id: dev
    title: 'Разработка'
    worker: coder
  - id: code-review,
    title: 'Ревью кода',
    worker: code-reviewer,
    sub:
      { id: stat-analyze, title: 'Статический анализ', worker: stat-analyzer },
    on_reject: { goto: dev, max_rounds: 2 }
  - id: tests
    title: 'Тесты'
    sub:
      - { id: test-api, title: 'API/бэкенд', worker: api-tester }
      - { id: test-ui, title: 'Фронт/UI', worker: ui-tester, optional: true }
      - { id: design-review, title: 'Фронт/UI', worker: design-reviewer, optional: true }
    on_reject: { goto: dev, max_rounds: 2 }
  - id: commit
    title: 'Коммит'
    worker: committer
    sub:
      - { id: qa-doc-write, title: 'Подготовка документации для QA', worker: qa-doc-writer }
    deps: [tests]
