# Переносимый шаблон воркфлоу разработки фичи.
# Скопируй его в проект кнопкой «Скопировать в проект» — файл ляжет в .orca/workflows/.
# Поля шага: id, title, agent, model+effort (опционально), spec/specFile, deps, checkpoint, on_reject.
id: feature-dev
title: 'Фича: план → ревью плана → разработка → ревью кода → тесты → коммит'
steps:
  - id: plan
    title: 'План (openspec)'
    agent: claude
    # model: claude-opus-4-5     # опционально: провайдерная модель агента
    # effort: high               # только вместе с model
    specFile: specs/plan.md
  - id: plan-review
    title: 'Ревью плана'
    agent: claude
    specFile: specs/plan-review.md
    deps: [plan]
  - id: dev-gate
    deps: [plan-review]
    checkpoint:
      question: 'План аппрувнут (вердикт ревью + proposal)? Запускать разработку?'
      options: [approve, request-changes]
  - id: dev
    title: 'Разработка'
    agent: claude
    specFile: specs/dev.md
    deps: [dev-gate]
    on_reject: { goto: dev, max_rounds: 2 }
  - id: code-review
    title: 'Ревью кода'
    agent: claude
    specFile: specs/code-review.md
    deps: [dev]
  - id: tests-gate
    deps: [code-review]
    checkpoint:
      question: 'Код после ревью аппрувнут? Запускать тесты?'
      options: [approve, request-changes]
  - id: test-api
    title: 'Тесты API/бэкенд'
    agent: claude
    specFile: specs/test-api.md
    deps: [tests-gate]
  - id: test-ui
    title: 'Проверка UI/фронт'
    agent: claude
    specFile: specs/test-ui.md
    deps: [tests-gate]
  - id: commit-gate
    deps: [test-api, test-ui]
    checkpoint:
      question: 'Тесты зелёные? Делать финальный коммит (без push)?'
      options: [approve, request-changes]
  - id: commit
    title: 'Коммит'
    agent: claude
    specFile: specs/commit.md
    deps: [commit-gate]
