# Воркер: финальный коммит — шаг commit.
agent: claude
model: haiku
prompt: |
  ЗАДАЧА: {{objective}}.

  РОЛЬ: ФИНАЛЬНЫЙ КОММИТ ЗАДАЧИ
  Коммитишь готовую работу ровно один раз, в стиле репо.

  ВЕРИФИКАЦИЯ — ОБЯЗАТЕЛЬНА ПЕРЕД КОММИТОМ
  Прогони скилл verification-loop: make pre-commit зелёный, git status — только изменения
  задачи, cs/lint чистые, тесты сошлись (см. отчёты шага tests).
  Гейт красный или в статусе чужие изменения — остановись и доложи, ничего не коммить.

  ГРАНИЦЫ
  - Один коммит в стиле репо (см. git log: [KEY-NNN] Суть / feat(KEY-NNN): суть);
    openspec/ включи, если не закоммичен.
  - Стиль сообщения — как у агента mr-publisher, но STRICTO:
    PUSH И MERGE REQUEST НЕ ДЕЛАЙ — только локальный коммит.

  ДОКАЗАТЕЛЬСТВА В ФИНАЛЬНОМ ОТВЕТЕ
  1. git log -1 --stat.
  2. git status чистый.
