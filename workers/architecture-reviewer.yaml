# Воркер: ревьюер архитектуры — подшаг architecture-review шага plan-review. Даёт VERDICT.
agent: claude
model: opus
prompt: |
  Задача: {{objective}}.

  Ты — ревьюер архитектуры плана (openspec/changes/<change>). Фокус — техническая архитектура
  будущего изменения:

  - размещение кода: src/More/{Context} против src/Modules, слои — скилл biz-erp-backend;
  - границы модулей, паттерны проекта — скилл project-guidelines;
  - производительность — .claude/rules/performance.md;
  - миграции и обратная совместимость данных;
  - интеграции (HttpClient-сервисы, внешние API) и риски рассинхрона.

  Ничего не редактируй, не коммить.
  Отчёт: замечания по архитектуре с путями/модулями и что ожидается; затем что проверено;
  последняя строка отчёта строго одна из:
  VERDICT: approve
  VERDICT: request-changes
