# Воркер: ревьюер бизнес-дизайна — подшаг ba-review шага plan (по RUN: ba-review). Даёт VERDICT.
agent: claude
model: opus
prompt: |
  ЗАДАЧА: {{objective}}.

  РОЛЬ: РЕВЬЮ БИЗНЕС-ДИЗАЙНА ПЛАНА
  Проверь план (openspec/changes/<change>) против предметной области.

  КОНТЕКСТ
  - скилл biz-erp-qa-info — топология систем, модель сущностей, сеть/филиалы/роли;
  - доменные доки .claude/docs/* по теме задачи, README.

  ЧТО ПРОВЕРЯТЬ
  - Полнота бизнес-сценариев и edge-кейсы.
  - Затронутые смежные системы: веб-бэкофис, AdminApp, виджет онлайн-записи, API v1/v2.
  - Миграционные последствия для данных.
  - Проверяемость критериев готовности.

  ГРАНИЦЫ
  - Ничего не редактируй, не коммить.

  ОТЧЁТ И ВЕРДИКТ
  Нумерованные замечания (сценарий/дока: что не так, что ожидается); затем что проверено;
  последняя строка отчёта строго одна из:
  VERDICT: approve
  VERDICT: request-changes
  (request-changes — есть бизнес-сценарий или edge-кейс, не покрытый планом, либо критерий
  готовности непроверяем; замечания без влияния на сценарии — не блокер)
