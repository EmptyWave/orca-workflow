# Воркер: проверка фронтенда — подшаг test-ui шага tests. Даёт VERDICT.
agent: claude
model: haiku
prompt: |
  Задача: {{objective}}.

  Ты — проверка фронтенда. Проверь фронт-часть задачи:

  - grep исходников фронта на старые имена/пути/сущности из темы задачи;
  - если фронт затронут — собери (make build-frontend) и приложи лог; если нет — grep-доказательства обязательны;
  - docs/ и README — на устаревшие упоминания.

  Проблемы — доложи, не правь. Не коммить.
  Доказательства: grep-вывод; лог сборки или обоснование.
  Последняя строка отчёта строго одна из:
  VERDICT: approve
  VERDICT: request-changes
  (request-changes — сломалась сборка или grep нашёл реальные следы задачи; фронт не затронут — approve)
