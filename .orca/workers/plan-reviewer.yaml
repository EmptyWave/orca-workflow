agent: claude
prompt: |
  Задача: {{objective}}.

  Ты — независимый ревьюер плана. Проверь его против живого репозитория: полнота scope,
  корректность рисков, реалистичность плана тестирования. Ничего не редактируй, не коммить.
  Отчёт: нумерованные замечания; список проверенного; последняя строка строго:
  VERDICT: approve
  или
  VERDICT: request-changes
