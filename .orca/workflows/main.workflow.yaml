# on_reject на ревью возвращает работу назад, тесты — один блок из трёх проверок.
id: main
title: 'development'
steps:
  - id: plan
    title: 'План (openspec)'
    specialist: planner
    sub:
      - { id: code-research, title: 'Ресерч по коду', specialist: code-researcher}
      - { id: web-search, title: 'Поиск необходимой информации', specialist: web-searcher, optional: true }
      - { id: ba-review, title: 'Ревью бизнес дизайна', specialist: ba-reviewer, optional: true }
  - id: plan-review,
    title: 'Ревью плана',
    specialist: plan-reviewer,
    sub:
      - { id: architecture-review, title: 'Ревью архитектуры', specialist: architecture-reviewer}
    on_reject: { goto: plan, max_rounds: 2 }
  - id: dev
    title: 'Разработка'
    specialist: coder
  - id: code-review,
    title: 'Ревью кода',
    specialist: code-reviewer,
    sub:
      { id: stat-analyze, title: 'Статический анализ', specialist: stat-analyzer },
    on_reject: { goto: dev, max_rounds: 2 }
  - id: tests
    title: 'Тесты'
    sub:
      - { id: test-api, title: 'API/бэкенд', specialist: api-tester }
      - { id: test-ui, title: 'Фронт/UI', specialist: ui-tester, optional: true }
      - { id: design-review, title: 'Фронт/UI', specialist: design-reviewer, optional: true }
    on_reject: { goto: dev, max_rounds: 2 }
  - id: commit
    title: 'Коммит'
    specialist: committer
    sub:
      - { id: qa-doc-write, title: 'Подготовка документации для QA', specialist: qa-doc-writer }
    deps: [tests]
