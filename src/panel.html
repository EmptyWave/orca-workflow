<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Workflow</title>
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        padding: 10px 10px 16px;
        font: 12.5px/1.45 -apple-system, system-ui, sans-serif;
        color: var(--orca-foreground);
        background: var(--orca-background);
        -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 13px; font-weight: 650; margin: 2px 0 8px; letter-spacing: .01em; }

      /* ---- tabs ---- */
      .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--orca-border); margin-bottom: 10px; }
      .tab {
        appearance: none; border: 0; background: none; cursor: pointer;
        font: inherit; color: var(--orca-muted-foreground);
        padding: 5px 9px 6px; border-radius: 6px 6px 0 0;
        border-bottom: 2px solid transparent; margin-bottom: -1px;
      }
      .tab:hover { color: var(--orca-foreground); }
      .tab.active { color: var(--orca-foreground); border-bottom-color: var(--orca-accent); font-weight: 600; }

      /* ---- cards, callouts ---- */
      .card {
        background: var(--orca-card); border: 1px solid var(--orca-border);
        border-radius: var(--orca-radius, 8px); padding: 9px 10px; margin: 0 0 10px;
      }
      .card h2 { font-size: 12px; font-weight: 650; margin: 0 0 6px; }
      .callout {
        border-left: 3px solid var(--orca-border); background: var(--orca-muted);
        border-radius: 6px; padding: 7px 9px; margin: 0 0 10px; white-space: pre-wrap;
      }
      .callout.danger { border-left-color: var(--orca-destructive); }
      .callout.warning { border-left-color: var(--orca-warning); }
      .callout.ok { border-left-color: #3fb950; }
      .muted { color: var(--orca-muted-foreground); }
      .tiny { font-size: 11px; }
      .rowline { display: flex; align-items: center; gap: 8px; }
      .spread { justify-content: space-between; }
      .ctxfield { margin-top: 10px; }
      .ctxchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
      .ctxchip { cursor: pointer; }
      .ctxchip:hover { border: 1px solid var(--orca-destructive, #f85149); }
      .ctxtrigger { display: flex; gap: 6px; align-items: center; padding: 5px 8px; border: 1px solid var(--orca-border); border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--orca-muted-foreground); background: var(--orca-card); }
      .ctxtrigger:hover { color: var(--orca-foreground); }
      .ctxlist { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; border: 1px solid var(--orca-border); border-radius: 6px; padding: 3px; }
      .ctxrow { display: flex; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--orca-muted-foreground); }
      .ctxrow:hover { background: var(--orca-muted); }
      .ctxrow.on { color: var(--orca-foreground); }
      .chip {
        display: inline-flex; align-items: center; gap: 4px;
        background: var(--orca-muted); border-radius: 999px; padding: 1px 8px;
        font-size: 11px; color: var(--orca-muted-foreground);
      }

      /* ---- controls ---- */
      button.btn {
        appearance: none; font: inherit; cursor: pointer;
        border: 1px solid var(--orca-border); background: var(--orca-card);
        color: var(--orca-foreground); border-radius: 6px; padding: 4px 10px;
      }
      button.btn:hover { border-color: var(--orca-muted-foreground); }
      button.btn:disabled { opacity: .5; cursor: default; }
      button.btn.primary { background: var(--orca-accent); border-color: var(--orca-accent); color: #fff; }
      button.btn.ghost { border-color: transparent; background: none; padding: 3px 6px; }
      button.btn.mini { padding: 2px 8px; font-size: 11px; }
      input, select {
        font: inherit; color: var(--orca-foreground); background: var(--orca-input);
        border: 1px solid var(--orca-border); border-radius: 6px; padding: 4px 7px; width: 100%;
        height: 28px; box-sizing: border-box;
      }
      input:focus, select:focus { outline: 1.5px solid var(--orca-accent); outline-offset: -1px; }
      label.f { display: block; margin: 7px 0 0; }
      label.f > span { display: block; font-size: 10.5px; color: var(--orca-muted-foreground); margin: 0 0 3px 1px; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

      /* ---- step rows (aip-like) ---- */
      .steps { display: flex; flex-direction: column; gap: 2px; }
      .step { display: flex; gap: 8px; padding: 5px 6px 5px 4px; border-radius: 7px; align-items: flex-start; }
      .step:hover { background: var(--orca-muted); }
      .step { cursor: pointer; }
      .step pre, .step input, .step select, .step textarea, .step button { cursor: auto; }
      .step .st { flex: 0 0 16px; height: 16px; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
      .step .ag { flex: 0 0 15px; height: 15px; margin-top: 1.5px; display: flex; align-items: center; justify-content: center; }
      .step .body { flex: 1; min-width: 0; }
      .step .title { font-weight: 600; overflow-wrap: anywhere; }
      .step .meta { font-size: 11px; color: var(--orca-muted-foreground); margin-top: 1px; overflow-wrap: anywhere; }
      /* Нить флоу — деревом: вертикальный пунктир непрерывен через все строки шага
         (5px ниже иконки главной строки, дальше без разрывов), подшаги сидят на нити
         и подключены коротким горизонтальным штрихом. z-index выше ховера —
         подсветка строки нить не перекрывает. Масок-фонов нет: любая тема. */
      .step.flow, .blockhead.flow, .step.childrow { position: relative; }
      .step.flow::before, .step.childrow::before {
        content: ''; position: absolute; left: 12px; top: -3px; bottom: -3px;
        border-left: 2px dashed rgba(139, 148, 158, .45); z-index: 1;
      }
      .step.flow::before { top: 27px; }
      .blockhead.flow::before {
        content: ''; position: absolute; left: 12px; top: 16px; bottom: -3px;
        border-left: 2px dashed rgba(139, 148, 158, .45); z-index: 1;
      }
      .step.childrow::after {
        content: ''; position: absolute; left: 15px; top: 12px; width: 16px;
        border-top: 2px dashed rgba(139, 148, 158, .45); z-index: 1;
      }
      .step.flow.conn-ok::before, .blockhead.flow.conn-ok::before, .step.childrow.conn-ok::before,
      .step.childrow.conn-ok::after { border-left-color: #3fb950; border-top-color: #3fb950; }
      .step.flow.conn-run::before, .blockhead.flow.conn-run::before, .step.childrow.conn-run::before,
      .step.childrow.conn-run::after { border-left-color: #d29922; border-top-color: #d29922; }
      .step.flow.conn-fail::before, .blockhead.flow.conn-fail::before, .step.childrow.conn-fail::before,
      .step.childrow.conn-fail::after { border-left-color: #f85149; border-top-color: #f85149; }
      .step.childrow { padding-left: 34px; position: relative; }

      .step.childrow .title { font-weight: 500; }
      .blockhead {
        display: flex; gap: 8px; align-items: center; padding: 5px 6px 3px; margin-top: 4px;
        color: var(--orca-muted-foreground); font-size: 11.5px; letter-spacing: .02em;
      }
      /* Гейт на нити флоу: строка сразу под шагом, замок сидит прямо на пунктире,
         состояние — текстом; клик разворачивает кнопки ответа. */
      .gaterow { position: relative; display: flex; gap: 8px; padding: 4px 6px 4px 34px; cursor: pointer; border-radius: 6px; }
      .gaterow:hover { background: var(--orca-muted); }
      .gaterow::before {
        content: ''; position: absolute; left: 12px; top: -3px; bottom: -3px;
        border-left: 2px dashed rgba(139, 148, 158, .45); z-index: 1;
      }
      /* сегмент трейса под замком красится как флоу: решён — пройден (зелёный),
         ждёт — удержан (янтарный, в тон закрытому замку) */
      .gaterow.conn-ok::before { border-left-color: #3fb950; }
      .gaterow.conn-run::before { border-left-color: #d29922; }
      .gaterow .lock {
        position: absolute; left: 4.5px; top: 50%; transform: translateY(-50%); z-index: 2;
        width: 15px; height: 15px; display: flex; align-items: center; justify-content: center;
        background: var(--orca-background); border-radius: 50%;
      }
      .gaterow .gq { font-size: 11.5px; }
      .gaterow .gs { font-size: 11px; color: var(--orca-muted-foreground); }
      .gaterow.pending .gs { color: var(--orca-warning, #d29922); font-weight: 600; }
      .gaterow .gate-btns { margin-top: 5px; }
      /* Предпросмотр шаблона: замок без нити и без клика — просто маркер после шага */
      .gaterow.static { cursor: default; }
      .gaterow.static:hover { background: none; }
      .gaterow.static::before { content: none; }
      .step.sub { padding-left: 28px; }
      .step.sub .title { font-weight: 400; color: var(--orca-muted-foreground); }
      .step .start { margin: 6px 0 2px; display: flex; flex-direction: column; gap: 6px; }
      .step-drawer { margin: 6px 0 2px; border-top: 1px dashed var(--orca-border); padding-top: 6px; }
      .attempt { display: flex; gap: 7px; align-items: center; margin: 3px 0; cursor: pointer; font-size: 11.5px; color: var(--orca-foreground); }
      .attempt:hover .att-title { text-decoration: underline; }
      .attempt .att-state { width: 13px; display: inline-flex; }
      .attempt pre { flex: 1; margin: 0; }
      .step-drawer pre {
        margin: 6px 0 0; max-height: 220px; overflow: auto; font: 11px ui-monospace, monospace;
        background: var(--orca-muted); border-radius: 6px; padding: 7px 9px; white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .spin {
        width: 13px; height: 13px; border-radius: 50%;
        border: 2px solid rgba(210, 153, 34, .38);
        border-top-color: #d29922;
        animation: wf-spin .8s linear infinite;
      }
      @keyframes wf-spin { to { transform: rotate(360deg); } }

      .skipdot {
        width: 14px; height: 14px; border-radius: 50%; position: relative; box-sizing: border-box;
        border: 2px solid rgba(139, 148, 158, .45);
      }
      .skipdot::after {
        content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px;
        background: rgba(139, 148, 158, .45); transform: translateX(-50%) rotate(45deg);
      }
      .step.skipped .body .title, .step.skipped .body .meta { opacity: .45; }
      /* ---- gates ---- */
      .gate-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
      /* ---- run history ---- */
      .histlist { display: flex; flex-direction: column; }
      .histrow { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--orca-border); }
      .histrow:last-child { border-bottom: 0; }
      .histrow:hover { background: var(--orca-muted); }
      .histrow .body { flex: 1; min-width: 0; }
      .histrow .title { font-weight: 600; overflow-wrap: anywhere; }
      .histrow .meta { font-size: 11px; color: var(--orca-muted-foreground); margin-top: 1px; }
      .gate-btns .btn.primary { background: #238636; border-color: #238636; }
      .gate-btns .btn.danger { background: var(--orca-destructive); border-color: var(--orca-destructive); color: var(--orca-destructive-foreground, #fff); }

      .notice { position: sticky; top: 0; z-index: 5; margin: 0 0 8px; }
      .skeleton { height: 12px; border-radius: 6px; background: var(--orca-muted); margin: 6px 0; animation: wf-pulse 1.4s ease infinite; }
      @keyframes wf-pulse { 50% { opacity: .45; } }
      .empty { color: var(--orca-muted-foreground); padding: 14px 4px; text-align: center; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11.5px; }
      .kv span:nth-child(odd) { color: var(--orca-muted-foreground); }
      code { font: 11px ui-monospace, monospace; background: var(--orca-muted); border-radius: 4px; padding: 0 4px; }
    </style>
  </head>
  <body>
    <h1>Workflow</h1>
    <div class="tabs" id="tabs"></div>
    <div id="notice"></div>
    <div id="view"></div>

    <script>
      // ------------------------------------------------------------------ icons
      const GREEN = '#3fb950', RED = '#f85149', AMBER = '#d29922'
      const ring = (color, mark) =>
        `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">` +
        `<circle cx="8" cy="8" r="6.4" stroke="${color}" stroke-width="1.5"/>${mark}</svg>`
      const clock = (color) =>
        `<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.6" stroke="${color}" stroke-width="1.6"/><path d="M8 5.2V8l2.1 1.4" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      const ICON = {
        ok: ring(GREEN, `<path d="M5 8.3l2 2 4-4.6" stroke="${GREEN}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`),
        fail: ring(RED, `<path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="${RED}" stroke-width="1.6" stroke-linecap="round"/>`),
        pause: clock('rgba(139,148,158,.6)'),
        readyClock: clock(AMBER),
        dot: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" fill="#8b949e"/></svg>`,
        pencil: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11.3 2.1l2.6 2.6-8.3 8.3-3.1.5.5-3.1zM10 3.4l2.6 2.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
        refresh: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v2.7h-2.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      }
      // Замок гейта: закрытый янтарный (ждёт ответа) / открытый зелёный (решён).
      const GATE_AMBER = 'var(--orca-warning, #d29922)'
      const lockClosed = (color) => `<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="3.2" y="6.8" width="9.6" height="7" rx="1.5" stroke="${color}" stroke-width="1.5"/><path d="M5.4 6.8V5a2.6 2.6 0 0 1 5.2 0v1.8" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="10.1" r="1" fill="${color}"/></svg>`
      // Закрытый замок: янтарный — флоу дошёл и ждёт ответа; серый — гейт ещё впереди.
      const LOCK_CLOSED = lockClosed(GATE_AMBER)
      const LOCK_CLOSED_IDLE = lockClosed('rgba(139,148,158,.6)')
      const LOCK_OPEN = `<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="3.2" y="6.8" width="9.6" height="7" rx="1.5" stroke="#3fb950" stroke-width="1.5"/><path d="M5.4 6.8V5a2.6 2.6 0 0 1 5-1" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/></svg>`
      const AGENT_SVG = {
        // Claude sunburst — from the Orca material-icons pack (Apache-2.0/MIT, © Google)
        claude: `<svg width="14" height="14" viewBox="0 0 16 16"><g fill="#e8703f"><path d="m14.375 6.48.49.28v.209l-.14.489-5.937 1.397-.558-1.387zm0 0"/><path d="m12.155 2.373.683.143.182.224.173.535-.072.342-3.983 5.447L7.81 7.737l3.673-4.82z"/><path d="m8.719 1.522.419-.28.349.14.349.49-.957 5.748-.65-.441-.279-.769.49-4.33z"/><path d="m4.239 1.614.43-.55L4.95 1l.558.081.275.216 2.004 4.442.724 2.11-.848.471-3.231-5.864z"/><path d="m2.154 4.665-.14-.56.42-.488.488.07h.14l2.933 2.165.908.698 1.257.978-.698 1.187-.629-.489-.419-.419-4.05-2.863z"/><path d="M1.316 8.296 1 7.946v-.31l.316-.108 3.562.21 3.491.279-.113.695-6.66-.346z"/><path d="M3.411 11.931h-.698l-.278-.32v-.382l1.186-.838 4.82-3.068.487.833z"/><path d="m4.738 13.883-.28.07-.418-.21.07-.35 4.12-5.446.558.768-3.072 4.05z"/><path d="m8.23 14.581-.21.28-.419.14-.349-.28-.21-.42L8.09 8.646l.629.07z"/><path d="M11.791 13.045v.558l-.07.21-.279.14-.489-.066-3.356-4.996 1.331-1.014 1.117 2.025.105.733z"/><path d="m13.398 12.207.07.349-.21.279-.21-.07-1.187-.838-1.815-1.606-1.397-.978.419-1.326.698.419.42.768z"/><path d="m12.49 8.645 1.746.14.419.28.279.418v.302l-.768.327-3.911-.978-1.606-.07.419-1.466 1.117.838z"/></g></svg>`,
        // OpenAI-style blossom, drawn here: six interlocking rings
        codex: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${[0,1,2,3,4,5].map((k) => { const a = (Math.PI / 3) * k - Math.PI / 2; const x = 12 + 4 * Math.cos(a), y = 12 + 4 * Math.sin(a); return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="6.6"/>` }).join('')}</svg>`,
        // Generic agent robot — from the Orca material-icons pack, recolored to the theme
        robot: `<svg width="14" height="14" viewBox="0 0 32 32"><path fill="currentColor" d="M2.636 24H6v-8H2.636a.63.63 0 0 0-.636.625v6.75a.63.63 0 0 0 .636.625M26 16v8h3.364c.351 0 .636-.355.636-.7v-6.675a.63.63 0 0 0-.636-.625zM17.417 6H14.69a.63.63 0 0 0-.636.625V12H8.69a.63.63 0 0 0-.636.625L8 25.375c0 .345.305.625.637.625h14.727a.63.63 0 0 0 .636-.625v-12.75a.63.63 0 0 0-.636-.625h-5.31V6.625A.63.63 0 0 0 17.416 6m-5.363 8c1.781 0 2.674 2.154 1.414 3.414s-3.414.368-3.414-1.414a2 2 0 0 1 2-2M22 24H10v-2h12zm-1.946-10c1.781 0 2.674 2.154 1.414 3.414s-3.414.368-3.414-1.414a2 2 0 0 1 2-2"/></svg>`,
        // GitHub Copilot — from the Orca material-icons pack, recolored to the theme
        copilot: `<svg width="14" height="14" viewBox="0 0 16 16"><path fill="currentColor" d="M7.998 14C4.006 14 1.11 11.457 1 10.728v-1.7c.074-.549.592-1.472 1.39-1.803l.031-.19a4 4 0 0 1 .11-.534c-.176-.444-.222-.946-.222-1.446 0-.759.112-1.544.606-2.168.507-.64 1.308-.98 2.384-1.1 1.055-.117 1.98.03 2.576.605l.037.036c.142-.06.298-.033.441-.063.32-.066.654-.132 1.015-.132.873 0 1.745.297 2.372.97.66.708.933 1.736.933 2.866 0 .685-.085 1.395-.318 2.037l.014.087c.203.987.3 1.822.3 2.617v.432c-.123.735-2.922 3.401-6.999 3.401z"/></svg>`
      }
      const agentIcon = (agent) => {
        if (!agent) return ''
        const a = agent.toLowerCase()
        if (a.startsWith('claude')) return AGENT_SVG.claude
        if (a.startsWith('codex')) return AGENT_SVG.codex
        if (a.startsWith('copilot')) return AGENT_SVG.copilot
        return AGENT_SVG.robot
      }

      // ------------------------------------------------------------------ state
      const S = {
        tab: 'runs',
        runs: null, runId: null, snap: null,
        project: null,
        tplSource: 'project', templates: null, tplId: null, tplFellBack: false,
        history: null,             // все раны для вкладки Run history
        objective: '', baseBranch: '', worktreeName: '', branch: '', context: '', ctxSessions: undefined, ctxPicked: [], ctxCustom: false,
        agent: 'claude', model: '', effort: '', worktree: '', raiseModel: '', models: undefined, modelOpen: false,
        startFor: null,           // task id with the start form open
        openStep: {},            // task ids expanded: gate, report, retry live inside the step (несколько одновременно)
        reports: {},              // taskId -> worker report text (fetched on demand)
        job: null, notice: null, busy: null,
        cfg: null, bridge: null, openAttempt: {}, openGate: null, gateAutoOpened: null, planFiles: undefined, sessionPath: null, sessionPathUnknown: false, armedDel: null
      }
      const STATUS_TEXT = {
        pending: 'ожидает', ready: 'готов к запуску', dispatched: 'работает', skipped: 'пропущен',
        blocked: 'ждёт гейт', queued: 'в очереди', succeeded: 'готово',
        failed: 'провал', unknown: 'неизвестно'
      }
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
      const req = (name, input, timeoutMs = 30000) => orca.plugin.request(name, input, { timeoutMs })
      const short = (id, p) => (id || '').replace(p, '')
      const setNotice = (m) => { S.notice = m; render() }
      const setBusy = (m) => { S.busy = m; render() }

      // persistence (the plugin's own storage, shared with the worker)
      const PERSIST = {
        tab: (v) => ['runs', 'templates', 'history', 'settings'].includes(v),
        runId: () => true, tplSource: (v) => ['library', 'project'].includes(v),
        tplId: () => true, objective: () => true, baseBranch: () => true, worktreeName: () => true, branch: () => true, context: () => true, ctxPicked: () => true, raiseModel: () => true,
        agent: () => true, model: () => true, effort: () => true, worktree: () => true
      }
      const remember = async (key, value) => {
        S[key] = value
        if (PERSIST[key] && PERSIST[key](value)) await orca.storage.set('html.' + key, value).catch(() => {})
      }
      const recall = async () => {
        for (const key of Object.keys(PERSIST)) {
          const v = await orca.storage.get('html.' + key).catch(() => null)
          if (v !== null && v !== undefined) S[key] = v
        }
        // The last detected project, so the Templates tab works before (or without) focus
        const remembered = await orca.storage.get('html.project').catch(() => null)
        if (remembered && typeof remembered === 'object' && remembered.path) S.project = remembered
      }

      // ------------------------------------------------------------------ effective status
      // Статусы честные, без распространения гейтов по deps: гейтнутый шаг сам приходит
      // со статусом 'blocked' (часы, «ждёт гейт»), а сам гейт показан отдельной строкой
      // на нити флоу — замок и текст состояния сразу под шагом.
      function effectiveStatuses(tasks) {
        const memo = new Map()
        for (const t of tasks) {
          const status = ['succeeded', 'failed', 'dispatched', 'blocked', 'ready'].includes(t.status) ? t.status : 'queued'
          memo.set(t.id, { status })
        }
        return memo
      }
      // «пропущен»: ни одной попытки, флоу уже прошёл его позицию — координатор не
      // счёл нужным. Optional-подшаги и проверки блоков условны по своей природе
      // (бриф: «не нужен — пропусти»); обязательный шаг с попытками сюда не попадёт.
      const isSkipped = (t, passedOrder) =>
        ['pending', 'ready'].includes(t.status) && passedOrder > (t.order ?? 0) &&
        !(S.snap?.workers || []).some((w) => w.taskId === t.id) &&
        (t.optional || String(t.parentTaskId || '').startsWith('step:'))
      const skippedIcon = (t, passedOrder) =>
        isSkipped(t, passedOrder)
          ? `<span title="пропущен: не запускался, флоу уже прошёл его позицию" style="display:inline-flex"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.6" stroke="rgba(139,148,158,.75)" stroke-width="1.6"/><path d="M4 12L12 4" stroke="rgba(139,148,158,.75)" stroke-width="1.6" stroke-linecap="round"/></svg></span>`
          : ''
      const statusIcon = (status) =>
        status === 'succeeded' ? ICON.ok
        : status === 'failed' ? ICON.fail
        : status === 'dispatched' ? `<div class="spin" title="работает"></div>`
        : status === 'ready' ? ICON.readyClock
        : status === 'queued' || status === 'pending' || status === 'blocked' ? ICON.pause
        : ICON.dot

      // ------------------------------------------------------------------ loads
      let loadingSince = {}
      // Эпоха своей загрузки: если воркер перезапускался (dev reload) — документ панели
      // устарел целиком (JS + состояние в памяти); перезагружаемся, а не живём зомби.
      let bootEpoch = null
      function checkEpoch(epoch) {
        if (epoch == null) return false
        if (bootEpoch === null) { bootEpoch = epoch; return false }
        return epoch !== bootEpoch
      }
      // Взводим красную кнопку удаления: второй клик по ней же — подтверждение.
      // Автовозврат через 5 секунд, любой другой клик — тоже снимает взвод.
      function armDelete(key) {
        S.armedDel = key
        render()
        setTimeout(() => { if (S.armedDel === key) { S.armedDel = null; render() } }, 5000)
      }
      // В одном ворктри может оказаться несколько ранов (перезапуски в то же имя).
      // Привязка: самый АКТИВНЫЙ ран (updated_at — задачи/гейты менялись) — чат
      // координатора мог быть закрыт у работающего рана и открытие у мёртвого,
      // реальную жизнь рана показывает активность. Тай-брейки: координатор, created.
      function pickSessionRun(runs) {
        if (!S.sessionPath) return null
        const own = (runs || []).filter((r) => r.worktreePath === S.sessionPath)
        if (own.length === 0) return null
        const cmp = (a, b) =>
          (b.updatedAt ?? '').localeCompare(a.updatedAt ?? '') ||
          ((b.hasCoordinator ? 1 : 0) - (a.hasCoordinator ? 1 : 0)) ||
          (b.createdAt ?? '').localeCompare(a.createdAt ?? '')
        return own.slice().sort(cmp)[0]
      }
      // Ран «свежий», если активность была в последние 3 часа: удаление такого
      // предупреждаем даже без бейджей — по ним не видно (чат бывает закрыт).
      function isFreshRun(r) {
        if (!r || !r.updatedAt) return false
        return Date.now() - new Date(r.updatedAt + 'Z').getTime() < 3 * 60 * 60 * 1000
      }
      async function loadRuns() {
        try {
          // Воркспейс сессии ждём до бинда (не fire-and-forget): без пути ран не привяжется
          // и до следующего опроса панель соврёт «нет рана». Сбой запроса прошлый путь не рвёт.
          try {
            const r = await req('session.workspace', undefined, 20000)
            S.sessionPath = r.path ?? null
            S.sessionPathUnknown = false
          } catch { S.sessionPathUnknown = true }
          const answer = await req('runs.list', undefined, 60000)
          if (checkEpoch(answer.epoch)) { location.reload(); return }
          S.runs = answer.runs
          delete loadingSince['запуски']
          // Ран привязан к сессии: показываем рана ЭТОГО воркспейса, без выбора из списка.
          const sessionRun = pickSessionRun(answer.runs)
          const wantedId = sessionRun?.runId ?? null
          if (S.runId !== wantedId) {
            S.runId = wantedId; S.snap = null; S.planFiles = undefined; S.openGate = null
            // воркер снапшотит ран из html.runId — ведём его за собой при перепривязке,
            // иначе после удаления/смены рана в кэш пишется чужой/пустой снапшот
            remember('runId', wantedId)
          }
        } catch (e) { if (!S.runs || S.runs.length === 0) S.runs = []; setNotice('Запуски не читаются: ' + esc(e.message || e)) }
        render()
      }
      async function loadState(force) {
        try {
          // The worker refreshes the snapshot on its own cadence and keeps it in storage:
          // reading it costs nothing. Only an explicit refresh pays for a live bridge call.
          const cached = force ? null : await orca.storage.get('state.snapshot').catch(() => null)
          // Кэш годится только для ТЕКУЩЕГО рана: воркер мог записать пустой снапшот
          // удалённого рана или чужой ран — тогда идём живым запросом.
          if (cached && typeof cached === 'object' && cached.tasks && cached.run && cached.run.runId === S.runId) {
            S.snap = cached
          } else {
            S.snap = await req('state.get', { runId: S.runId }, 60000)
          }
        } catch (e) {
          S.snap = { at: Date.now(), run: null, tasks: [], gates: [], workers: [], error: e.message || String(e), pilot: null }
        }
        render()
      }
      async function loadProject() {
        const before = S.project?.path ?? null
        try {
          const answer = await req('project.current', undefined, 90000)
          // The worker resolves the scope: the focused workflow project, or the project of
          // the most recent run — focus drifting outside a project never blanks the panel.
          if (answer.project) {
            if (answer.project.path !== before) { S.templates = null; S.tplId = null }
            S.project = answer.project
            if (answer.isWorkflow) await orca.storage.set('html.project', S.project).catch(() => {})
          }
        } catch { /* keep the remembered one */ }
        // Templates may have failed while the project was still unknown — retry now.
        if (S.tab === 'templates' && (S.templates === null || S.templates.length === 0)) void loadTemplates()
        render()
      }
      /** Все раны для вкладки Run history: чистка старья и навигация по памяти. */
      async function loadHistory() {
        try {
          const answer = await req('runs.list', undefined, 60000)
          S.history = { runs: answer.runs ?? [], error: null }
        } catch (e) {
          S.history = { runs: [], error: String(e.message || e) }
        }
        render()
      }

      let tplInFlight = false
      async function loadTemplates() {
        if (tplInFlight) return
        tplInFlight = true
        try {
        const wantProject = S.tplSource === 'project'
        if (wantProject && !S.project) await loadProject()
        // No project to read from: the library still has templates — show it instead of a dead end.
        const useProject = wantProject && !!S.project
        S.tplFellBack = wantProject && !useProject
        const answer = await req('template.list', {
          source: useProject ? 'project' : 'library',
          projectPath: useProject ? S.project.path : null
        }, 60000)
        S.templates = answer.templates
        S.notice = null
        delete loadingSince['шаблоны']
        if (answer.templates.length > 0 && !answer.templates.some((t) => t.id === S.tplId)) S.tplId = answer.templates[0].id
        } catch (e) { if (!S.templates || S.templates.length === 0) S.templates = []; setNotice('Шаблоны не читаются: ' + esc(e.message || e)) }
        finally { tplInFlight = false }
        render()
      }
      async function loadSettings() {
        try {
          S.cfg = await req('settings.get', undefined, 10000)
          if (!S.agent) S.agent = S.cfg.defaultAgent
          S.bridge = (await req('bridge.info', undefined, 10000)).terminalId
        } catch { /* extras, not required */ }
        render()
      }

      // ------------------------------------------------------------------ actions
      async function resolveGate(gate, resolution) {
        setBusy('гейт ' + short(gate.id, 'gate_').slice(0, 10) + '…')
        try {
          await req('gate.resolve', { gateId: gate.id, resolution, runId: S.runId, question: gate.question })
          S.openGate = null
          setNotice(`Гейт закрыт: ${esc(resolution)}. Координатор держит ход и опрашивает гейт — продолжит сам в течение ~20 секунд. Прошла пара минут тишины — напиши ему в чат: «гейт подтверждён (${esc(resolution)}), продолжай».`)
          await loadState()
        }
        catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
      }
      async function startTask(task) {
        setBusy('старт ' + task.title)
        try {
          if (!S.worktree.trim()) throw new Error('выбери ворктри для запуска воркера')
          await req('task.start', {
            taskId: task.id, agent: S.agent, runId: S.runId,
            model: S.model.trim() === '' ? null : S.model.trim(),
            effort: S.effort.trim() === '' ? null : S.effort.trim(),
            worktree: S.worktree
          }, 120000)
          S.startFor = null
          await loadState()
        } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
      }
      /** Человеческий текст шага джобы поднятия рана (job.step из воркера). */
      function jobStepText(step) {
        if (!step) return 'стартуем'
        if (step === 'run-create') return 'создаём ран'
        if (step === 'tasks') return 'создаём шаги'
        if (step === 'materialized') return 'шаги готовы'
        if (step === 'coordinator') return 'поднимаем координатора'
        if (step === 'done') return 'готово'
        if (step.startsWith('task ')) return 'задача ' + step.slice(5)
        return step
      }
      async function instantiate() {
        const tpl = (S.templates || []).find((t) => t.id === S.tplId)
        if (!tpl) return
        setNotice(null)
        // Оптимистичный running: кнопка гаснет и лоадер стартует сразу, не после первого опроса
        S.job = { status: 'running', step: 'run-create', error: null, runId: null, kind: 'instantiate', label: tpl.title, id: 'current' }
        render()
        try {
          // цель опциональна: пустая — координатор сам спросит в чате, что делаем
          if (S.worktreeName.trim() === '') throw new Error('заполни имя ворктри')
          const answer = await req('template.instantiate', {
            source: S.tplFellBack ? 'library' : S.tplSource,
            projectPath: !S.tplFellBack && S.tplSource === 'project' ? S.project?.path ?? null : null,
            templateId: tpl.id, objective: S.objective.trim(),
            baseBranch: S.baseBranch.trim() === '' ? null : S.baseBranch.trim(),
            branch: S.branch.trim() === '' ? null : S.branch.trim(),
            context: ctxValue(),
            raiseModel: S.raiseModel.trim() === '' ? null : S.raiseModel.trim(),
            worktreeName: S.worktreeName.trim(), agent: S.agent
          })
          for (let i = 0; i < 40; i++) {
            await new Promise((r) => setTimeout(r, 2000))
            const poll = await req('job.get', { jobId: answer.jobId }, 10000)
            if (poll.job) S.job = poll.job
            render()
            if (!poll.job || poll.job.status !== 'running') break
          }
          if (S.job && S.job.status === 'done' && S.job.runId) {
            S.runId = S.job.runId
            await orca.storage.set('html.runId', S.runId).catch(() => {})
            S.tab = 'runs'
            S.job = null
            await loadRuns(); await loadState()
          }
        } catch (e) {
          S.job = { status: 'failed', error: String(e.message || e), runId: null, kind: 'instantiate', label: tpl.title, id: 'current' }
        } finally { render() }
      }
      async function copyTemplate(to) {
        setBusy('копирование шаблона')
        const from = S.tplFellBack ? 'library' : S.tplSource
        try {
          await req('template.copy', {
            from, to, templateId: S.tplId,
            fromProjectPath: from === 'project' ? S.project?.path ?? null : null,
            toProjectPath: to === 'project' ? S.project?.path ?? null : null
          })
          setNotice('шаблон скопирован (' + (to === 'library' ? 'в библиотеку' : 'в проект') + ')')
        } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
      }
      async function editTemplate() {
        setBusy('открытие редактора')
        try {
          if (S.tplSource !== 'project' || !S.project) throw new Error('граф-редактор открывает шаблоны проекта — перенеси шаблон в проект кнопкой ниже')
          await req('template.edit', { projectPath: S.project.path, templateId: S.tplId })
        } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
      }
      async function saveSettings() {
        setBusy('сохранение настроек')
        try {
          const saved = await req('settings.save', {
            libraryDir: S.cfg.libraryDir, refreshMs: Number(S.cfg.refreshMs) || 10000, defaultAgent: S.cfg.defaultAgent
          })
          S.cfg = { ...S.cfg, ...saved }
          setNotice('настройки сохранены')
        } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
      }
      async function resetBridge() {
        setBusy('пересоздание моста')
        try { await req('bridge.reset', undefined, 10000); S.bridge = (await req('bridge.info', undefined, 10000)).terminalId }
        catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
      }
      // ------------------------------------------------------------------ render
      const el = () => document.getElementById('view')
      function render() {
        try {
          // tabs
          const tabs = [['runs', 'Run'], ['templates', 'Шаблоны'], ['history', 'Run history'], ['settings', 'Настройки']]
          document.getElementById('tabs').innerHTML = tabs.map(([id, label]) =>
            `<button class="tab${S.tab === id ? ' active' : ''}" data-tab="${id}">${label}</button>`).join('')
          // notice / busy
          const nb = document.getElementById('notice')
          nb.innerHTML = S.notice
            ? `<div class="callout danger">${S.notice}<button class="btn ghost mini" data-act="dismiss" style="float:right">×</button></div>`
            : S.busy ? `<div class="callout tiny">${esc(S.busy)}…</div>` : ''
          el().innerHTML = S.tab === 'runs' ? viewRuns() : S.tab === 'templates' ? viewTemplates() : S.tab === 'history' ? viewHistory() : viewSettings()
          wire()
        } catch (e) {
          // A render crash must not freeze the frame forever: say so and offer a reload.
          el().innerHTML = `<div class="callout danger">Панель споткнулась: ${esc(e && e.message ? e.message : String(e))}</div>` +
            `<button class="btn" data-act="reload">Перезагрузить панель</button>`
          wire()
        }
      }
      function wire() {
          document.querySelectorAll('[data-tab]').forEach((b) =>
          b.onclick = () => { remember('tab', b.dataset.tab); if (b.dataset.tab === 'templates' && !S.templates) void loadTemplates(); if (b.dataset.tab === 'history' && !S.history) void loadHistory(); if (b.dataset.tab === 'settings' && !S.cfg) void loadSettings(); render() })
        document.querySelectorAll('[data-act]').forEach((b) => {
          if (b.classList.contains('step')) return // строки-шаги проводим отдельным проводом ниже
          const [act, arg] = b.dataset.act.split(':')
          const map = {
            dismiss: () => { S.notice = null; render() },
            reload: () => location.reload(),
            'go-templates': () => { S.tab = 'templates'; S.templates = null; render(); void loadTemplates() },
            'ctx-open': () => { S.ctxOpen = !S.ctxOpen; render() },
            'model-open': () => { S.modelOpen = !S.modelOpen; render() },
            'model-pick': () => { S.raiseModel = arg; void remember('raiseModel', arg); render() },
            'ctx-toggle': () => {
              if (arg === 'custom') { S.ctxCustom = !S.ctxCustom; render(); return }
              const i = Number(arg)
              const at = S.ctxPicked.indexOf(i)
              if (at >= 0) S.ctxPicked.splice(at, 1); else S.ctxPicked.push(i)
              void remember('ctxPicked', S.ctxPicked)
              render()
            },
            'toggle-step': () => { if (S.openStep[arg]) delete S.openStep[arg]; else S.openStep[arg] = true; render() },
            'load-report': async () => {
              const task = (S.snap?.tasks || []).find((x) => x.id === arg)
              if (!task?.dispatchId) return
              S.reports[arg] = '…'
              render()
              try { S.reports[arg] = (await req('task.report', { dispatchId: task.dispatchId }, 60000)).report || '(пусто)' }
              catch (e) { S.reports[arg] = 'ошибка: ' + (e.message || e) }
              render()
            },
            'open-attempt': () => {
              const [taskId, dispatchId] = String(arg).split('|')
              S.openAttempt[taskId] = S.openAttempt[taskId] === dispatchId ? null : dispatchId
              render()
            },
            'resume-pilot': async () => {
              setBusy('будим автопилот')
              try { await req('pilot.resume', { runId: S.runId }, 30000); await loadState() }
              catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
            },
            'retry-step': async () => {
              setBusy('ретрай с шага')
              try {
                await req('task.retry', { runId: S.runId, taskId: arg }, 120000)
                delete S.reports[arg]
                await loadState()
              } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
            },
            refresh: () => { void loadRuns(); void loadState(true) },
            'refresh-tpl': () => { S.templates = null; render(); void loadTemplates() },
            'resolve-approve': () => void resolveGate(S.snap.gates.find((g) => g.id === arg), 'approve'),
            'resolve-custom': () => void resolveGate(S.snap.gates.find((g) => g.id === arg), b.dataset.option),
            'toggle-gate': () => { S.openGate = S.openGate === arg ? null : arg; render() },
            'dismiss-job': () => { S.job = null; render() },
            'open-plan-file': () => {
              void (async () => {
                try {
                  await req('file.open', { worktreePath: S.planFiles?.worktreePath, rel: arg }, 30000)
                } catch (e) { setNotice('файл не открылся: ' + esc(e.message || e)) }
              })()
            },
            'start-open': () => { S.startFor = S.startFor === arg ? null : arg; render() },
            'start-run': () => void startTask(S.snap.tasks.find((t) => t.id === arg)),
            'delete-run': async () => {
              const r = S.runs.find((x) => x.runId === S.runId)
              if (!r) return
              if ((r.liveWorkers || 0) > 0) { setNotice('У рана работают воркеры — сначала останови их'); return }
              // confirm() во встроенной панели молча возвращает false — модалки запрещены.
              // Подтверждение двухшаговое: первый клик взводит красную кнопку, второй удаляет.
              const key = `run:${S.runId}`
              if (S.armedDel !== key) { armDelete(key); return }
              S.armedDel = null
              setBusy('удаление рана')
              try {
                await req('run.delete', { runId: S.runId }, 60000)
                S.runId = null
                await loadRuns(); await loadState()
              } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
            },
            'brief-refresh': async () => {
              setBusy('пересборка брифа')
              try {
                const r = await req('run.brief.refresh', { runId: S.runId }, 90000)
                setNotice(null)
                S.notice = `Бриф пересобран из текущих шаблона и карточек: ${esc(r.briefPath ?? '')} — осведоми координатора («перечитай .orca/coordinator-brief.md»)`
                render()
              } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
            },
            'hist-del': async () => {
              const r = (S.history?.runs || []).find((x) => x.runId === arg)
              if (!r) return
              if ((r.liveWorkers || 0) > 0) { setNotice('У рана работают воркеры — сначала останови их'); return }
              const key = `hist:${arg}`
              if (S.armedDel !== key) { armDelete(key); return }
              S.armedDel = null
              setBusy('удаление рана')
              try {
                await req('run.delete', { runId: arg }, 60000)
                if (S.runId === arg) S.runId = null
                await loadHistory()
                await loadRuns()
              } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
            },
            'hist-refresh-brief': async () => {
              setBusy('пересборка брифа')
              try {
                const r = await req('run.brief.refresh', { runId: arg }, 90000)
                setNotice(`Бриф пересобран: ${esc(r.briefPath ?? '')}`)
              } catch (e) { setNotice(esc(e.message || e)) } finally { S.busy = null; render() }
            },
            'instantiate': () => void instantiate(),
            'copy-project': () => void copyTemplate('project'),
            'copy-library': () => void copyTemplate('library'),
            'edit-tpl': () => void editTemplate(),
            'save-cfg': () => void saveSettings(),
            'reset-bridge': () => void resetBridge()
          }
          if (map[act]) b.onclick = (ev) => {
            ev.stopPropagation()
            // красная «точно удалить?» взведена — любой другой клик её гасит
            if (S.armedDel && act !== 'delete-run' && act !== 'hist-del') S.armedDel = null
            map[act]()
          }
        })
        document.querySelectorAll('[data-bind]').forEach((node) => {
          const key = node.dataset.bind
          const handler = () => void remember(key, node.type === 'number' ? node.value : node.value)
          node.oninput = handler
          node.onchange = handler
        })

        document.querySelectorAll('[data-bind-select]').forEach((node) => {
          node.onchange = async () => {
            const key = node.dataset.bindSelect
            // сам выбранный элемент обязан влиять на текущий рендер сразу,
            // а не только после перезагрузки панели (помнили в storage, но S не трогали)
            if (key in S) S[key] = node.value
            await remember(key, node.value)
            if (key === 'tplSource') { S.templates = null; S.tplId = null; S.tplFellBack = false; render(); void loadTemplates() }
            else if (key === 'tplId') render()
            if (key === 'runId') void loadState()
            if (key === 'tab') render()
          }
        })
        document.querySelectorAll('.step[data-act]').forEach((row) => {
          const [act, arg] = row.dataset.act.split(':')
          row.onclick = () => {
            if (act !== 'toggle-step') return
            if (S.openStep[arg]) delete S.openStep[arg]; else S.openStep[arg] = true
            render()
          }
        })
        document.querySelectorAll('.step-drawer').forEach((d) => { d.onclick = (ev) => ev.stopPropagation() })

      }

      // ---- loading state that knows how long it has been loading
      function stuck(what) {
        const t0 = loadingSince[what] ?? (loadingSince[what] = Date.now())
        const slow = Date.now() - t0 > 15000
        return `<div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:50%"></div>` +
          (slow ? `<div class="callout warning tiny">«${esc(what)}» грузятся дольше 15 секунд — вероятно, мост ждёт таймаут или воркер перезапускается. <button class="btn mini" data-act="reload">Перезагрузить панель</button></div>` : ``)
      }

      // ---- runs view
      /** Runs of the current project; when it has none, everything (so the tab still works). */
      function visibleRuns() {
        const all = S.runs || []
        if (!S.project) return all
        const mine = all.filter((r) => r.projectPath === S.project.path)
        return { visible: mine.length > 0 ? mine : all, mine: mine.length, others: all.length - mine.length }
      }
      function scopeHint() {
        if (!S.project) return ''
        const v = visibleRuns()
        if (v.mine > 0 && v.others > 0) return `<div class="tiny muted" style="margin:4px 0 8px">Раны проекта «${esc(S.project.name)}» · из других проектов скрыто: ${v.others}</div>`
        if (v.mine === 0 && v.others > 0) return `<div class="tiny muted" style="margin:4px 0 8px">В проекте «${esc(S.project.name)}» ещё нет ранов — показаны все.</div>`
        return ''
      }
      function viewRuns() {
        if (!S.runs) return stuck('запуски')
        const sessionRun = pickSessionRun(S.runs)
        if (!sessionRun) return `<div class="empty">${S.sessionPathUnknown
          ? 'Не удалось определить воркспейс этой сессии.<br/><span class="tiny muted">нажми «Обновить» — привязка рана восстановится</span><br/><button class="btn mini" data-act="refresh" style="margin-top:8px">${ICON.refresh} Обновить</button>'
          : 'В этой сессии нет рана.<br/><span class="tiny muted">ран живёт в воркспейсе, созданном при «Поднять Run» — открой его, чтобы следить</span><br/><button class="btn mini" data-act="go-templates" style="margin-top:8px">Поднять Run из шаблона</button>'}</div>`
        const snap = S.snap
        const sel = `<div class="rowline" style="align-items:center;gap:6px">` +
          `<span class="chip" style="white-space:normal;line-height:1.35" title="${esc(sessionRun.objective)}">${esc(sessionRun.objective)}</span>` +
          `<button class="btn ghost" data-act="refresh" title="Обновить">${ICON.refresh}</button>` +
          `<button class="btn ghost" data-act="brief-refresh" title="Пересобрать бриф координатора из текущего шаблона и карточек (рой, промты); координатора осведоми сам — «бриф обновлён, перечитай .orca/coordinator-brief.md»">↻ бриф</button>` +
          ((sessionRun.liveWorkers || 0) > 0
            ? `<button class="btn ghost" disabled title="У рана работают воркеры — сначала останови их">✕</button>`
            : S.armedDel === `run:${sessionRun.runId}`
              ? `<button class="btn mini" data-act="delete-run" style="color:var(--orca-destructive,#f85149);border-color:var(--orca-destructive,#f85149)" title="${sessionRun.hasCoordinator ? 'Внимание: к рану привязана сессия координатора — после удаления она останется без рана. ' : ''}Повторный клик удалит ран, задачи, гейты и отчёты безвозвратно">точно удалить?</button>`
              : `<button class="btn ghost" data-act="delete-run" title="Удалить ран (задачи, гейты, отчёты — безвозвратно)">✕</button>`) + '</div>'
        if (!snap) return sel + `<div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:60%"></div>`
        const errorCallout = snap.error ? `<div class="callout danger">${esc(snap.error)}</div>` : ''
        const counts = (snap.tasks || []).reduce((acc, t) => { acc[t.status] = (acc[t.status] || 0) + 1; return acc }, {})
        const done = counts.succeeded || 0, total = (snap.tasks || []).length
        let pilotBox = ''
        if (snap.pilot) {
          if (snap.pilot.driver === 'coordinator') {
            pilotBox = `<div class="tiny muted" style="margin:2px 0 8px">Ран ведёт координатор-агент${snap.pilot.stopped ? ' — стоп: ' + esc(snap.pilot.stopped) : ''} · шагов ${done}/${total}. Сессия координатора — чат в workspace проекта: задачи, вопросы и эскалации туда.</div>`
          } else if (snap.pilot.stopped) {
            pilotBox = `<div class="callout warning">Автопилот остановлен: ${esc(snap.pilot.stopped)} <button class="btn mini" data-act="resume-pilot">разбудить</button></div>`
          } else if (snap.pilot.on) {
            pilotBox = `<div class="tiny muted" style="margin:2px 0 8px">Автопилот ведёт конвейер · шагов ${done}/${total}${(counts.dispatched || 0) > 0 ? ' · работает' : ''}</div>`
          } else {
            pilotBox = `<div class="tiny muted" style="margin:2px 0 8px">Автопилот выключен в настройках · шагов ${done}/${total}</div>`
          }
        }

        const gateByTask = new Map((snap.gates || []).map((g) => [g.taskId, g]))

        // Файлы плана для подтверждения гейта: человек апрувит конкретные спеки — тянем
        // новейший openspec-change из ворктри рана один раз на ран (пока гейт ждёт).
        if ((snap.gates || []).some((g) => g.status === 'pending') && S.planFiles === undefined) {
          S.planFiles = null
          void req('plan.files', { runId: S.runId }, 30000)
            .then((r) => { S.planFiles = r })
            .catch(() => { S.planFiles = null })
            .finally(() => render())
        }

        // Flow order from the template beats the CLI's task-list order (it reshuffles
        // whenever statuses flip); tasks without a stamp keep the arrival order.
        const orderedTasks = [...(snap.tasks || [])].sort((a, b) => (a.order ?? 999) - (b.order ?? 999))
        const eff = effectiveStatuses(orderedTasks)
        const byId = new Map(orderedTasks.map((t) => [t.id, t]))
        // Ран ещё не начал работать (ничего не запускалось и не завершилось): даже формально
        // ready-шаги выглядят спящими — серые часы вместо янтарных, никакой суеты до команд
        // координатора.
        const runStarted = orderedTasks.some((t) => ['dispatched', 'succeeded', 'failed'].includes(t.status))
        // Флоу достиг гейта — подтверждение нужно ПРЯМО СЕЙЧАС: удерживаемая задача стоит
        // в blocked И все её прочие зависимости закрыты (не «заблокирована заранее», а
        // «дошла очередь»). Разворачиваем кнопки один раз; свернул руками — уважаем,
        // по умолчанию (гейт где-то впереди или ран не начат) строка свёрнута.
        const gateReached = (g) => {
          if (g.status !== 'pending' || eff.get(g.taskId)?.status !== 'blocked') return false
          const held = byId.get(g.taskId)
          return !held || (held.deps || []).every((d) => byId.get(d)?.status === 'succeeded')
        }
        const reachedGate = (snap.gates || []).find(gateReached)
        if (reachedGate && S.gateAutoOpened !== reachedGate.id) {
          S.gateAutoOpened = reachedGate.id
          if (S.openGate === null) S.openGate = reachedGate.id
        }
        // Group sub-step tasks under their parent (or under a block header for pure blocks).
        const kidsOf = new Map()
        for (const t of orderedTasks) {
          if (!t.parentTaskId) continue
          const arr = kidsOf.get(t.parentTaskId) || []
          arr.push(t)
          kidsOf.set(t.parentTaskId, arr)
        }
        const emitted = new Set()
        const stepRows = []
        let flowIndex = 0
        const totalFlow = orderedTasks.filter((t) => !t.parentTaskId || String(t.parentTaskId).startsWith('step:')).length
        // Координаторские задачи «вне шаблона»: если в названии есть id шага (латиницей),
        // история раундов показывается под этим шагом, а не хвостом внизу.
        const extrasByStep = new Map()
        const strayExtras = []
        for (const t of orderedTasks) {
          if (t.order != null || t.parentTaskId) continue
          const hit = orderedTasks.find((o) => o.order != null && !o.parentTaskId && (t.title || '').toLowerCase().includes((o.title || ' ').split(' ')[0].toLowerCase()) && /[a-z-]{3,}/.test((o.title || ' ').split(' ')[0]))
          if (hit) {
            const arr = extrasByStep.get(hit.id) || []
            arr.push(t); extrasByStep.set(hit.id, arr); emitted.add(t.id)
          } else if (t.order == null) {
            strayExtras.push(t); emitted.add(t.id)
          }
        }
        // самый дальний пройденный порядок: незапущенные optional позади него — пропущены
        const maxPassedOrder = orderedTasks.reduce((m, t) => ((eff.get(t.id) || { status: t.status }).status === 'succeeded' ? Math.max(m, t.order ?? 0) : m), -1)
        const aggregate = (kids) => {
          // пропущенные проверки — не участники блока: блок закрыт, когда сдали все запущенные
          const st = kids.filter((k) => !isSkipped(k, maxPassedOrder)).map((k) => (eff.get(k.id) || { status: k.status }).status)
          if (st.includes('failed')) return 'failed'
          if (st.includes('dispatched')) return 'dispatched'
          if (st.every((x) => x === 'succeeded')) return 'succeeded'
          // Блок — контейнер, его не «запускают»: частичная готовность детей это не
          // «готов к запуску», а «ещё идёт» — серые часы. Гейтнутых детей тоже
          // показывает как ожидание.
          return 'queued'
        }
        for (const t of orderedTasks) {
          if (emitted.has(t.id)) continue
          if (t.parentTaskId && t.parentTaskId.startsWith('step:')) {
            const kids = kidsOf.get(t.parentTaskId) || []
            for (const k of kids) emitted.add(k.id)
            const agg = aggregate(kids)
            const activeKids = kids.filter((k) => !isSkipped(k, maxPassedOrder))
            const doneKids = activeKids.filter((k) => (eff.get(k.id) || { status: k.status }).status === 'succeeded').length
            const skippedKids = kids.length - activeKids.length
            stepRows.push(`<div class="blockhead${flowIndex < totalFlow - 1 ? ` flow conn-${agg === 'succeeded' ? 'ok' : agg === 'dispatched' ? 'run' : 'idle'}` : ''}">${statusIcon(agg === 'ready' && !runStarted ? 'pending' : agg)} Блок «${esc(t.parentTaskId.slice(5))}» — подшаги ${doneKids}/${activeKids.length}${skippedKids > 0 ? ` (+${skippedKids} пропущено)` : ''}</div>`)
            flowIndex += 1
            for (const k of kids) {
              // gate-on-block вешается на первого ребёнка — замок перед ним, на входе в блок
              if (gateByTask.has(k.id)) stepRows.push(gateRow(k.id))
              stepRows.push(stepRow(k, true))
            }
            continue
          }
          if (t.parentTaskId) continue // nested under a real parent task, rendered with it
          emitted.add(t.id)
          const kids = kidsOf.get(t.id) || []
          const own = eff.get(t.id) || { status: t.status }
          // Пока подшаги родителя работают, родитель не должен выглядеть мёртвым («ожидает»):
          // его фактическое состояние — работа группы. Реальный статус придёт, когда родитель стартует сам.
          const kidsWorking = kids.some((k) => (eff.get(k.id) || { status: k.status }).status === 'dispatched')
          const kidsDone = kids.length > 0 && kids.every((k) => (eff.get(k.id) || { status: k.status }).status === 'succeeded')
          const groupStatus = ['pending', 'ready', 'queued', 'unknown'].includes(own.status)
            ? (kidsWorking ? 'dispatched' : kidsDone ? 'ready' : own.status)
            : own.status
          // Гейт держит старт шага: замок на нити ПЕРЕД шагом, который он удерживает
          if (gateByTask.has(t.id)) stepRows.push(gateRow(t.id))
          stepRows.push(stepRow({ ...t, status: groupStatus }, false))
          flowIndex += 1
          for (const k of kids) {
            emitted.add(k.id)
            stepRows.push(stepRow(k, true))
          }
          for (const ex of extrasByStep.get(t.id) || []) {
            emitted.add(ex.id)
            // Задача координатора вне шаблона — обычная иконка статуса, не точка:
            // рераны и follow-up'ы обязаны читаться как шаги (галочка/спиннер/часы).
            const exStatus = (eff.get(ex.id) || { status: ex.status }).status
            stepRows.push(`<div class="step childrow" title="задача координатора вне шаблона"><div class="st">${statusIcon(exStatus)}</div><div class="body"><div class="title" style="font-weight:400;color:var(--orca-muted-foreground)">⟲ ${esc(ex.title)}</div></div></div>`)
          }
        }
        for (const ex of strayExtras) {
          const exStatus = (eff.get(ex.id) || { status: ex.status }).status
          stepRows.push(`<div class="step" title="задача координатора вне шаблона"><div class="st">${statusIcon(exStatus)}</div><div class="body"><div class="title" style="font-weight:400;color:var(--orca-muted-foreground)">⚙ ${esc(ex.title)}</div><div class="meta">вне шаблона (координатор)</div></div></div>`)
        }
        const steps = stepRows.join('')

        /** Гейт на нити флоу: замок на пунктире + состояние текстом; клик — кнопки ответа.
         *  В pending — ссылки на файлы плана: видно, что именно апрувишь. */
        function gateRow(taskId) {
          const g = gateByTask.get(taskId)
          if (!g) return ''
          const pending = g.status === 'pending'
          // Дошёл ли флоу до гейта: замок и сегмент трейса янтарные только в этот момент,
          // впереди — серые, как весь непройденный пунктир.
          const reached = gateReached(g)
          const lock = !pending ? LOCK_OPEN : reached ? LOCK_CLOSED : LOCK_CLOSED_IDLE
          const state = !pending ? `решён${g.resolution ? ': ' + g.resolution : ''}` : reached ? 'ждёт ответа' : 'впереди'
          // Воркер отдаёт files строками-путями; старые ответы могли нести {rel} — едим оба.
          const planFiles = pending && S.planFiles && S.planFiles.change
            ? `<div class="tiny" style="margin-top:3px;color:var(--orca-muted-foreground)">план: openspec/changes/${esc(S.planFiles.change)}/ — ` +
              (S.planFiles.files || []).map((f) => {
                const rel = typeof f === 'string' ? f : String(f?.rel ?? '')
                if (rel === '') return ''
                return `<a data-act="open-plan-file:${esc(rel)}" title="${esc(rel)}" style="color:var(--orca-accent);cursor:pointer">${esc(rel.split('/').pop())}</a>`
              }).filter(Boolean).join(' · ') +
              `</div>`
            : ''
          const btns = pending && S.openGate === g.id
            ? `<div class="gate-btns">` +
              (g.options && g.options.length > 0 ? g.options : ['approve', 'request-changes'])
                .map((o) => `<button class="btn mini${o === 'approve' ? ' primary' : o === 'request-changes' ? ' danger' : ''}" data-act="resolve-custom:${esc(g.id)}" data-option="${esc(o)}">${esc(o === 'approve' ? 'approve ✓' : o === 'request-changes' ? 'request-changes ✗' : o)}</button>`).join('') +
              `</div>`
            : ''
          return `<div class="gaterow${reached ? ' pending conn-run' : pending ? '' : ' conn-ok'}" data-act="toggle-gate:${esc(g.id)}" title="гейт шага ${esc(short(g.taskId, 'task_'))}">
            <span class="lock">${lock}</span>
            <div class="body">
              <div><span class="gq">гейт · ${esc(g.question)}</span> <span class="gs">${esc(state)}</span></div>
              ${planFiles}
              ${btns}
            </div>
          </div>`
        }

        function stepRow(t, child) {
          const skipped = isSkipped(t, maxPassedOrder)
          const e = eff.get(t.id) || { status: t.status }
          // В неначатом ране ready выглядит спящим: серые часы, не янтарные.
          const iconStatus = e.status === 'ready' && !runStarted ? 'pending' : e.status
          // Вердикт последней попытки важнее статуса задачи: succeeded-воркер, сказавший
          // request-changes, это ОТКЛОНЕНИЕ, а не «готово». Флаг expectsVerdict тут не
          // нужен — он требуется только точке «не определился», а определившийся вердикт
          // авторитетен сам по себе (ba-review не review-юнит, но реджектит по делу).
          const attempts = (S.snap?.workers || []).filter((w) => w.taskId === t.id)
          const lastVerdict = attempts.length > 0 ? (attempts[attempts.length - 1].verdict ?? null) : null
          const rejected = e.status === 'succeeded' && lastVerdict === 'request-changes'
          const meta = [
            t.agent, skipped ? 'ПРОПУЩЕН' : rejected ? 'отклонено (request-changes)' : STATUS_TEXT[e.status] ?? e.status,
            t.order == null ? 'вне шаблона (создана координатором)' : null,
            (t.deps || []).length > 0 ? 'после: ' + t.deps.map((d) => short(d, 'task_')).join(', ') : null,
            t.dispatchId ? 'воркер ' + short(t.dispatchId, 'ctx_') : null
          ].filter(Boolean).join(' · ')
          const coordDriven = S.snap?.pilot?.driver === 'coordinator'
          const startForm = e.status === 'ready' && coordDriven ? `<div class="tiny muted" style="margin:6px 0 2px">ран ведёт координатор — старт шага в его сессии</div>`
            : e.status === 'ready' && S.startFor === t.id ? `
            <div class="start">
              <div class="grid2">
                <label class="f"><span>агент</span><input data-bind="agent" value="${esc(S.agent)}"/></label>
                <label class="f"><span>модель (опц.)</span><input data-bind="model" value="${esc(S.model)}" placeholder="model"/></label>
                <label class="f"><span>effort (опц.)</span><input data-bind="effort" value="${esc(S.effort)}" placeholder="high"/></label>
                <label class="f"><span>ворктри</span><input data-bind="worktree" value="${esc(S.worktree)}" placeholder="name:my-task"/></label>
              </div>
              <div><button class="btn primary mini" data-act="start-run:${esc(t.id)}">Стартовать</button></div>
            </div>` : ''
          const startBtn = e.status === 'ready' ? ` <button class="btn ghost mini" data-act="start-open:${esc(t.id)}">${S.startFor === t.id ? 'скрыть' : 'старт'}</button>` : ''
          const canOpen = t.dispatchId || e.status === 'failed' || (t.fallback || []).length > 0
          const chev = canOpen || true
            ? ` <button class="btn ghost mini" data-act="toggle-step:${esc(t.id)}" title="Подробности шага">${S.openStep[t.id] ? '▾' : '▸'}</button>`
            : ''
          let drawer = ''
          if (S.openStep[t.id]) {
            const bits = []
            // Ручной реран: проваленный шаг — «ретрай», завершённый — «перезапустить»
            // (сброс шага и его хвоста; в coordinator-ране подхватит координатор).
            if (e.status === 'failed' || e.status === 'succeeded') {
              bits.push(`<div class="gate-btns"><button class="btn mini" data-act="retry-step:${esc(t.id)}" title="Сбросить шаг и всё, что от него зависит, в pending">${e.status === 'failed' ? '↻ Ретрай с этого шага' : '↻ Перезапустить шаг'}</button></div>`)
            }
            // Попытки шага (GitLab-style): каждый диспетчер — свёрнутая строка, клик разворачивает отчёт.
            const attempts = (S.snap?.workers || []).filter((w) => w.taskId === t.id)
            if (attempts.length > 0) {
              const openD = S.openAttempt[t.id]
              bits.push(`<div class="tiny muted" style="margin:4px 0 2px">Попытки (${attempts.length})</div>`)
              for (let ai = 0; ai < attempts.length; ai++) {
                const at = attempts[ai]
                const isOpen = at.dispatchId === openD
                if (isOpen && S.reports[at.dispatchId] === undefined) {
                  S.reports[at.dispatchId] = '…'
                  void req('task.report', { dispatchId: at.dispatchId, runId: S.runId, taskId: t.id }, 60000)
                    .then((r) => { S.reports[at.dispatchId] = r.report || '(пусто)' })
                    .catch((err) => { S.reports[at.dispatchId] = 'ошибка: ' + (err.message || err) })
                    .finally(() => render())
                }
                const v = at.verdict ?? null
                const stIcon = at.state === 'failed' ? ICON.fail
                  : at.state === 'ready' || at.state === 'starting' ? '<div class="spin" title="работает"></div>'
                  : at.state === 'succeeded'
                    ? (v === 'request-changes' ? ICON.fail : v === 'approve' || !t.expectsVerdict ? ICON.ok : ICON.dot)
                    : ICON.dot ?? ''
                const vTitle = v === 'request-changes' ? ' · попытка ОТКЛОНЕНА (request-changes)' : v === 'approve' ? ' · вердикт approve' : t.expectsVerdict ? ' · вердикт не определён (нет VERDICT в отчёте и сабджекте)' : ''
                const vLabel = v === 'request-changes' ? ' <span style="color:var(--orca-destructive, #f85149)">✗ отклонена</span>' : ''
                bits.push(`<div class="attempt" data-act="open-attempt:${esc(t.id)}|${esc(at.dispatchId)}" title="попытка #${ai + 1}${vTitle}">
                  <span class="att-state">${stIcon}</span>
                  <span class="att-title">#${ai + 1} ${esc(at.agent ?? '')}${at.model ? ' · ' + esc(at.model) : ''}${vLabel}</span>
                </div>`)
                if (isOpen && S.reports[at.dispatchId] !== undefined) {
                  bits.push(`<div class="rowline" style="align-items:flex-start"><pre style="flex:1">${esc(S.reports[at.dispatchId])}</pre></div>`)
                }
              }
            } else {
              bits.push(`<div class="tiny muted">Ещё не запускался${(t.fallback || []).length > 0 ? ' · fallback: ' + esc(t.fallback.join(', ')) : ''}</div>`)
            }
            if ((t.fallback || []).length > 0 && e.status !== 'failed') {
              bits.push(`<div class="tiny muted">fallback-цепочка: ${esc([t.agent, ...t.fallback].filter(Boolean).join(' → '))}</div>`)
            }
            drawer = `<div class="step-drawer">${bits.join('')}</div>`
          }
          const conn = `conn-${rejected ? 'fail' : e.status === 'succeeded' ? 'ok' : e.status === 'dispatched' ? 'run' : 'idle'}`
          const nest = child
            ? ` childrow ${conn}`
            : (flowIndex < totalFlow - 1 ? ` flow ${conn}` : '')
          const branch = child ? `<span style="color:var(--orca-muted-foreground)">↳ </span>` : ''
          const inBlock = child && String(t.parentTaskId || '').startsWith('step:')
            ? `<div class="tiny muted" style="margin-left:2px">в блоке «${esc(String(t.parentTaskId).slice(5))}»</div>`
            : ''
          return `<div class="step${skipped ? ' skipped' : ''}${nest}" data-act="toggle-step:${esc(t.id)}">
            <div class="st">${skippedIcon(t, maxPassedOrder) || (rejected ? ICON.fail : statusIcon(iconStatus))}</div>
            <div class="ag">${agentIcon(t.agent)}</div>
            <div class="body">
              <div class="title">${branch}${esc(t.title || t.id)}${startBtn}${chev}</div>
              ${inBlock}
              <div class="meta">${esc(meta)}</div>
              ${startForm}
              ${drawer}
            </div>
          </div>`
        }

        const jobCard = S.job && S.job.status !== 'done' ? `<div class="callout ${S.job.status === 'failed' ? 'danger' : ''}">${esc(S.job.error || 'поднятие рана: ' + jobStepText(S.job.step))}</div>` : ''
        return sel + pilotBox + errorCallout + jobCard +
          ((snap.tasks || []).length > 0 ? `<div class="card"><h2>Шаги</h2><div class="steps">${steps}</div></div>` : `<div class="empty">В этом ране нет шагов.</div>`)
      }

      // ---- templates view
      // Итоговый контекст для рана: выбранные доноры (по одному указанию на строку)
      // + своё указание; без выбранных доноров своё остаётся самостоятельным контекстом.
      function ctxValue() {
        const donors = (S.ctxPicked || []).map((i) => (S.ctxSessions || [])[i]).filter(Boolean).map((o) => o.value)
        const own = S.context.trim()
        if (S.ctxCustom && own !== '') donors.push(own)
        const joined = donors.join('\n')
        return joined === '' ? null : joined
      }
      function agentModels() {
        return (S.models || []).filter((m) => (m.agent || '').toLowerCase().startsWith((S.agent || '').toLowerCase().split(/[ \/]/)[0]))
      }
      async function loadModels() {
        try { S.models = (await req('models.list', undefined, 30000)).models || [] } catch { S.models = [] }
      }
      async function loadCtxSessions() {
        try {
          const r = await req('context.sessions', { projectPath: S.project ? S.project.path : null }, 30000)
          S.ctxSessions = r.sessions || []
        } catch { S.ctxSessions = [] }
        render()
      }
      function viewTemplates() {
        if (S.ctxSessions === undefined) { S.ctxSessions = null; void loadCtxSessions() }
        if (S.models === undefined) { S.models = null; void loadModels().then(() => render()) }
        const effSource = S.tplFellBack ? 'library' : S.tplSource
        const header = `<div class="rowline" style="margin-bottom:8px">
          <select data-bind-select="tplSource" style="flex:1">
            <option value="project"${S.tplSource === 'project' ? ' selected' : ''}>Проект (.orca/workflows)</option>
            <option value="library"${S.tplSource === 'library' ? ' selected' : ''}>Библиотека</option>
          </select>
          <button class="btn ghost" data-act="refresh-tpl" title="Перечитать">${ICON.refresh}</button></div>`
        const project = !S.project && !S.tplFellBack
          ? `<div class="callout warning">Проект не найден — открой workspace репозитория в Orca.</div>`
          : `<div class="rowline spread" style="margin-bottom:8px">
              ${S.project ? `<span class="chip">Проект: ${esc(S.project.name)}</span>` : '<span></span>'}
              ${S.tplFellBack ? '<span class="chip">не в проекте — показана библиотека</span>' : ''}
            </div>`
        if (!S.templates) { void loadTemplates(); return header + project + stuck('шаблоны') }
        if (S.templates.length === 0) {
          return header + project + (effSource === 'project'
            ? `<div class="empty">В проекте нет шаблонов (.orca/workflows пуст). Скопируй из библиотеки: источник «Библиотека» → «↳ в проект».</div>`
            : `<div class="empty">В библиотеке нет шаблонов — добавь ${'{'}id}.workflow.yaml в её каталог (Настройки).</div>`)
        }
        const tpl = S.templates.find((t) => t.id === S.tplId) ?? S.templates[0]
        const tplSelect = `<div class="rowline" style="margin-bottom:8px">
          <select data-bind-select="tplId" style="flex:1">
            ${S.templates.map((t) => `<option value="${esc(t.id)}"${t.id === tpl.id ? ' selected' : ''}>${esc(t.title || t.id)}</option>`).join('')}
          </select>
          <button class="btn ghost" data-act="edit-tpl" title="Открыть в граф-редакторе">${ICON.pencil}</button></div>`

        let preview
        if (tpl.error) preview = `<div class="callout danger">Шаблон не читается: ${esc(tpl.error)}</div>`
        else if ((tpl.missingWorkers ?? []).length > 0) preview = `<div class="callout warning">Нет карточек воркеров: ${esc(tpl.missingWorkers.join(', '))} — ран не поднять, пока не создашь их.</div>`
        else {
          const rows = tpl.steps.flatMap((step) => {
            const meta = [
              step.specialist ? 'воркер ' + step.specialist : null,
              step.swarm?.enabled ? `рой ≤${step.swarm.limit ?? '∞'}` : null,
              (step.deps || []).length > 0 ? 'deps: ' + step.deps.join(', ') : null,
              step.onReject ? `on_reject → ${step.onReject.goto} (≤${step.onReject.maxRounds})` : null
            ].filter(Boolean).join(' · ')
            const main = `<div class="step">
              <div class="ag">${agentIcon(step.agent)}</div>
              <div class="body"><div class="title">${esc(step.id)}${step.title ? ' · ' + esc(step.title) : ''}</div><div class="meta">${esc(meta)}</div></div>
            </div>`
            const subs = (step.sub || []).map((child) => `<div class="step sub">
              <div class="ag">${agentIcon(child.agent)}</div>
              <div class="body"><div class="title">↳ ${esc(child.id)}${child.title ? ' · ' + esc(child.title) : ''}</div>
              <div class="meta">${child.optional ? 'опциональный: ' : ''}${child.phase === 'before_start' ? 'до старта воркера' : child.phase === 'parallel' ? 'параллельно с воркером' : child.phase === 'before_end' ? 'после работы, до отчёта' : 'после отчёта'}</div></div>
            </div>`).join('')
            // Гейт шага — замок после шага, как в ране: подтверждает результат, спросит человека
            const gate = step.gate
              ? `<div class="gaterow static pending"><span class="lock">${LOCK_CLOSED}</span><div class="body"><div><span class="gq">гейт · ${esc(step.gate.question)}</span> <span class="gs">спросит после шага</span></div></div></div>`
              : ''
            return [main, subs, gate]
          }).join('')
          preview = `<div class="steps">${rows}</div>`
        }

        return header + project + tplSelect +
          `<div class="card"><h2>${esc(tpl.title || tpl.id)}</h2>
            <div class="tiny muted" style="margin-bottom:6px">${esc(tpl.id)} · ${esc(tpl.file)}</div>
            ${preview}</div>` +
          `<div class="card"><h2>Поднять Run</h2>
            <label class="f"><span>заголовок (опц.) — координатор всегда уточнит цель, описание и скоуп в чате</span><input data-bind="objective" value="${esc(S.objective)}" placeholder="имя задачи, например «Momento: партнёрская авторизация»"/></label>
            <div class="grid2">
              <label class="f"><span>base branch (опц.)</span><input data-bind="baseBranch" value="${esc(S.baseBranch)}" placeholder="master"/></label>
              <label class="f"><span>имя ворктри</span><input data-bind="worktreeName" value="${esc(S.worktreeName)}" placeholder="feature-x"/></label>
            </div>
            <label class="f" title="Пусто — Orca сам даст ветку <логин>/<имя-ворктри>; заполнено — точное имя ветки без логина"><span>ветка (опц.)</span><input data-bind="branch" value="${esc(S.branch)}" placeholder="feat/momento-release"/></label>
            <div class="f ctxfield" title="Отметь прошлые раны и живые сессии — их артефакты координатор прочитает первым делом">
              <div class="ctxtrigger" data-act="ctx-open" title="Показать/скрыть список доноров">сессии-доноры контекста (опц.)${S.ctxPicked.length > 0 ? ` — выбрано ${S.ctxPicked.length}` : ''} ${S.ctxOpen ? '▾' : '▸'}</div>
${!S.ctxOpen && S.ctxPicked.length > 0 ? `              <div class="ctxchips">${S.ctxPicked.map((i) => (S.ctxSessions || [])[i]).filter(Boolean).map((o) => `<span class="chip ctxchip" data-act="ctx-toggle:${S.ctxSessions.indexOf(o)}" title="клик — убрать">${o.kind === 'run' ? '📁' : '💬'} ${esc(o.label.split('·')[0].trim())} ✕</span>`).join('')}</div>` : ''}
${S.ctxOpen ? `              <div class="ctxlist">
                ${(S.ctxSessions || []).map((o, i) => `<div class="ctxrow${S.ctxPicked.includes(i) ? ' on' : ''}" data-act="ctx-toggle:${i}"><span class="cb">${S.ctxPicked.includes(i) ? '☑' : '☐'}</span> ${o.kind === 'run' ? '📁' : '💬'} ${esc(o.label)}</div>`).join('')}
                <div class="ctxrow${S.ctxCustom ? ' on' : ''}" data-act="ctx-toggle:custom"><span class="cb">${S.ctxCustom ? '☑' : '☐'}</span> ✏️ своё указание…</div>
              </div>` : ''}
            </div>
${S.ctxCustom
  ? `<label class="f" title="Дополнение к выбранным донорам — файлы/пути/пояснения"><span>контекст — своё указание</span><input data-bind="context" value="${esc(S.context)}" placeholder="openspec/changes/momento-release-backend-prep, .orca/plan.md"/></label>`
  : ''}
            <label class="f"><span>агент по умолчанию</span><input data-bind="agent" value="${esc(S.agent)}"/></label>
            <div class="f ctxfield" title="Модель переопределяет карточную только для шагов без явной model в карточке/шаблоне">
              <div class="ctxtrigger" data-act="model-open">модель (опц.)${S.raiseModel !== '' ? ` — ${esc(S.raiseModel)}` : ''} ${S.modelOpen ? '▾' : '▸'}</div>
${S.modelOpen ? `              <div class="ctxlist">
                <div class="ctxrow${S.raiseModel === '' ? ' on' : ''}" data-act="model-pick:"><span class="cb">${S.raiseModel === '' ? '●' : '○'}</span> по умолчанию агента</div>
                ${(agentModels() || []).map((m) => `<div class="ctxrow${S.raiseModel === m.id ? ' on' : ''}" data-act="model-pick:${esc(m.id)}"><span class="cb">${S.raiseModel === m.id ? '●' : '○'}</span> ${esc(m.label || m.id)}</div>`).join('') || '<div class="ctxrow" style="cursor:default">нет данных каталога для агента</div>'}
              </div>` : ''}
            </div>
            <div class="rowline" style="margin-top:9px; flex-wrap:wrap">
              ${raiseButton(tpl)}
              ${effSource === 'library' ? `<button class="btn" data-act="copy-project">↳ в проект</button>` : `<button class="btn" data-act="copy-library">↳ в библиотеку</button>`}
            </div>
            ${raiseCard()}</div>`
      }

      /** Кнопка «Поднять Run»: пока джоба running — глухая, с лоадером; текст меняется. */
      function raiseButton(tpl) {
        const raising = S.job?.status === 'running'
        const missing = (tpl.missingWorkers ?? []).length > 0
        const dis = raising || missing
        const title = missing ? 'Сначала создай недостающих воркеров' : raising ? 'Ран поднимается…' : ''
        const label = raising
          ? `<span style="display:inline-flex;align-items:center;gap:7px"><span class="spin"></span>Поднимаем…</span>`
          : 'Поднять Run'
        return `<button class="btn primary" data-act="instantiate"${dis ? ' disabled' : ''}${title ? ` title="${esc(title)}"` : ''}>${label}</button>`
      }

      /** Прогресс/ошибка поднятия рана рядом с кнопкой: живой шаг воркера или разбор провала. */
      function raiseCard() {
        const job = S.job
        if (!job || job.kind !== 'instantiate') return ''
        if (job.status === 'running') {
          return `<div class="callout tiny" style="display:flex;align-items:center;gap:8px;margin-top:9px">
