            <span class="spin"></span><span>Поднимаем ран: ${esc(jobStepText(job.step))}…</span></div>`
        }
        if (job.status === 'failed') {
          return `<div class="callout danger" style="margin-top:9px">
            <b>Ран не поднялся.</b> ${esc(job.error || 'неизвестная ошибка')}
            <button class="btn ghost mini" data-act="dismiss-job" style="float:right">×</button></div>`
        }
        return ''
      }

      // ---- run history view
      function viewHistory() {
        if (!S.history) { void loadHistory(); return `<div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:50%"></div>` }
        const h = S.history
        if (h.error) return `<div class="callout danger">Раны не читаются: ${esc(h.error)}</div>`
        if (h.runs.length === 0) return `<div class="empty">Ранов пока нет.</div>`
        const rows = h.runs.map((r) => {
          const project = r.projectPath ? r.projectPath.split('/').filter(Boolean).pop() : '—'
          const worktree = r.worktreePath ? r.worktreePath.split('/').filter(Boolean).pop() : '—'
          const mine = r.runId === S.runId
          // Активность рана: живой координатор и работающие воркеры. Удалять такой —
          // оставить агента без рана (или получить отказ воркера), поэтому видно сразу.
          const live = (r.liveWorkers || 0) > 0
          const badges =
            (mine ? ' <span class="chip" title="ран текущей сессии">текущая сессия</span>' : '') +
            (r.hasCoordinator ? ' <span class="chip" title="к рану привязана живая сессия координатора"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#3fb950"></i> координатор</span>' : '') +
            (live ? ` <span class="chip" title="воркеры рана прямо работают — удаление отклоняется"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#e2a03f"></i> воркеры: ${r.liveWorkers}</span>` : '')
          const delBtn = live
            ? `<button class="btn ghost mini" disabled title="У рана работают воркеры — сначала останови их">✕</button>`
            : S.armedDel === `hist:${r.runId}`
              ? `<button class="btn mini" data-act="hist-del:${esc(r.runId)}" style="color:var(--orca-destructive,#f85149);border-color:var(--orca-destructive,#f85149)" title="${r.hasCoordinator ? 'Внимание: к рану привязана сессия координатора — после удаления она останется без рана. ' : ''}${isFreshRun(r) ? 'ВНИМАНИЕ: ран был активен недавно — возможно, это рабочий ран. ' : ''}Повторный клик удалит ран, задачи, гейты и отчёты безвозвратно">${isFreshRun(r) ? 'ран активен — точно удалить?' : 'точно удалить?'}</button>`
              : `<button class="btn ghost mini" data-act="hist-del:${esc(r.runId)}" title="Удалить ран (задачи, гейты, отчёты — безвозвратно)">✕</button>`
          return `<div class="histrow">
            <div class="body">
              <div class="title">${esc(r.objective)}${badges}</div>
              <div class="meta">${esc(project)} · ворктри ${esc(worktree)} · ${esc(short(r.runId, 'run_'))}</div>
            </div>
            <button class="btn ghost mini" data-act="hist-refresh-brief:${esc(r.runId)}" title="Пересобрать бриф координатора из текущего шаблона и карточек">↻ бриф</button>
            ${delBtn}
          </div>`
        }).join('')
        return scopeHint() + `<div class="card"><h2>Run history — ${h.runs.length}</h2><div class="histlist">${rows}</div></div>`
      }

      // ---- settings view
      function viewSettings() {
        if (!S.cfg) { void loadSettings(); return `<div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:80%"></div>` }
        return `<div class="card"><h2>Настройки</h2>
          <label class="f"><span>Каталог библиотеки шаблонов</span><input data-bind="cfg.libraryDir" value="${esc(S.cfg.libraryDir)}"/></label>
          <div class="grid2">
            <label class="f" title="как часто воркер перечитывает ран (2000–120000)"><span>Опрос ранов, мс</span><input type="number" data-bind="cfg.refreshMs" value="${esc(S.cfg.refreshMs)}"/></label>
            <label class="f"><span>Агент по умолчанию</span><input data-bind="cfg.defaultAgent" value="${esc(S.cfg.defaultAgent)}"/></label>
          </div>
          <div class="rowline" style="margin-top:9px"><button class="btn primary" data-act="save-cfg">Сохранить</button></div></div>
        <div class="card"><h2>Мост</h2>
          <div class="kv">
            <span>помощник</span><span>${S.bridge ? `<code>${esc(S.bridge.slice(0, 22))}…</code>` : 'не создан'}</span>
          </div>
          <div class="rowline" style="margin-top:8px"><button class="btn" data-act="reset-bridge">Пересоздать помощника</button></div>
          <div class="tiny muted" style="margin-top:6px">Команды CLI воркер выполняет сам; мутации оркестрации подписываются терминалом-помощником.</div></div>`
      }

      // ------------------------------------------------------------------ boot
      void (async () => {
        await recall()
        if (!S.tab) S.tab = 'runs'
        render()
        const autoTab = () => {
          // The session has no Run: land on Templates, ready to raise one.
          if (S.tab !== 'runs') return false
          if ((S.runs || []).some((r) => r.worktreePath === S.sessionPath)) return false
          S.tab = 'templates'
          S.templates = null
          void loadTemplates()
          return true
        }
        void loadProject().then(async () => {
          await loadRuns()
          if (autoTab()) return
          if (S.tab === 'runs') void loadState()
        })
        try {
          orca.plugin.on('state.changed', () => { if (S.tab === 'runs') void loadState() })
          orca.plugin.on('job.progress', (p) => { if (p && p.job) { S.job = p.job; render() } })
          // The editor changed a template: swap it in, no bridge, no re-reading.
          orca.plugin.on('templates.changed', (p) => {
            if (!p || !p.template || !S.project || p.projectPath !== S.project.path) return
            if (!Array.isArray(S.templates)) return
            const id = p.template.id
            const at = S.templates.findIndex((t) => t.id === id)
            if (at >= 0) S.templates = S.templates.map((t, i) => (i === at ? p.template : t))
            else S.templates = [p.template, ...S.templates]
            if (!S.tplId) S.tplId = id
            render()
          })
        } catch { /* events are an extra */ }
        // focus moved to another workspace: rescope the project, its runs and templates
        let wsTimer = null
        try {
          orca.on('workspace.changed', () => {
            clearTimeout(wsTimer)
            wsTimer = setTimeout(async () => {
              await loadProject()
              await loadRuns()
              if (autoTab()) return
              if (S.tab === 'runs') await loadState()
              else render()
            }, 800)
          })
        } catch { /* focus events are an extra */ }
        // another surface (or a script) changed a persisted UI key: follow it
        try {
          orca.storage.onDidChange(async (change) => {
            if (!change || change.key !== 'html.tab') return
            const v = await orca.storage.get('html.tab')
            if (typeof v === 'string' && ['runs', 'templates', 'settings'].includes(v)) { S.tab = v; render() }
          })
        } catch { /* older Orca */ }
        // poll: the worker also refreshes on its own; this keeps the panel honest if posts are missed
        const loop = async () => {
          for (;;) {
            let ms = 10000
            try { ms = Math.min(120000, Math.max(2000, (await orca.settings.get()).refreshMs ?? 10000)) } catch {}
            await new Promise((r) => setTimeout(r, ms))
            if (S.tab === 'runs' && !S.busy) await loadState(false)
          }
        }
        void loop()
      })()

    </script>
  </body>
</html>
